      <label class="sr-only" for="tenantPin">Kod dostępu</label><input id="tenantPin" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="Kod dostępu" maxlength="12" autocomplete="one-time-code">

<script>
window.PI_CONFIG = Object.assign({
  SUPABASE_URL:'https://qwcohaglwowpgjgbfscw.supabase.co',
  SUPABASE_PUBLISHABLE_KEY:'sb_publishable_v-9m11onzicV5-rWwZYwPw_57l7Q91-'
}, window.PI_CONFIG || {});
if(!window.PI_CONFIG.SUPABASE_URL || !window.PI_CONFIG.SUPABASE_PUBLISHABLE_KEY){
  const boot=document.getElementById('bootLoader');
  if(boot) boot.textContent='Brakuje konfiguracji Supabase w js/config.js.';
  console.warn('PureInvest: brak konfiguracji publicznej.');
}

if(!window.supabase || typeof window.supabase.createClient !== 'function'){
  console.warn('PureInvest: biblioteka Supabase CDN nie została załadowana. Logowanie email będzie chwilowo niedostępne; tryb gościa nadal używa funkcji Netlify.');
  window.supabase = { createClient(){ return { auth:{ getSession:async()=>({data:{session:null},error:null}), signInWithPassword:async()=>({data:null,error:{message:'Brak biblioteki Supabase CDN.'}}), signOut:async()=>({error:null}) } }; } };
}

const db=window.supabase.createClient(window.PI_CONFIG.SUPABASE_URL || 'https://example.supabase.co', window.PI_CONFIG.SUPABASE_PUBLISHABLE_KEY || 'missing-publishable-key');
const PI_NAV_HANDOFF_KEY='piNavigationHandoffV1925';
function piWriteNavigationHandoff(kind,payload){
  try{
    localStorage.setItem(PI_NAV_HANDOFF_KEY,JSON.stringify({createdAt:Date.now(),kind,payload}));
  }catch(_){ }
}
const $=id=>document.getElementById(id); const msg=t=>{$('msg').textContent=t||''};
function mode(which,focusField=true){ const owner=which==='owner'; $('ownerForm').classList.toggle('hidden',!owner); $('tenantForm').classList.toggle('hidden',owner); $('ownerTab').classList.toggle('active',owner); $('tenantTab').classList.toggle('active',!owner); $('ownerTab').setAttribute('aria-selected',String(owner)); $('tenantTab').setAttribute('aria-selected',String(!owner)); $('ownerTab').tabIndex=owner?0:-1; $('tenantTab').tabIndex=owner?-1:0; $('picker').classList.add('hidden'); msg(''); if(focusField)setTimeout(()=>$(owner?'ownerLogin':'tenantPhone')?.focus(),0); }
$('ownerTab').onclick=()=>mode('owner'); $('tenantTab').onclick=()=>mode('tenant');
[$('ownerTab'),$('tenantTab')].forEach((tab,index)=>tab.addEventListener('keydown',event=>{ if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return; event.preventDefault(); const next=event.key==='Home'?0:event.key==='End'?1:event.key==='ArrowRight'?(index+1)%2:(index+1)%2; const target=next===0?'owner':'tenant'; mode(target,false); $(target+'Tab').focus(); }));

$('ownerForm').addEventListener('submit',async e=>{
  e.preventDefault();
  msg('Loguję...');
  const loginRaw=$('ownerLogin').value.trim();
  const secret=$('ownerSecret').value;
  if(!loginRaw||!secret){msg('Podaj login i hasło.');return;}

  const normalizedLogin=loginRaw.toLowerCase();
  const sandboxLogin=(normalizedLogin==='admin' && secret==='admin') || normalizedLogin==='demo@pure-invest.pl';
  if(sandboxLogin){
    try{
      msg(normalizedLogin==='demo@pure-invest.pl'?'Uruchamiam konto demonstracyjnego zarządcy...':'Uruchamiam tryb gościa...');
      const r=await fetch('/.netlify/functions/friend-login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({login:loginRaw,password:secret}),
        cache:'no-store'
      });
      const data=await r.json().catch(()=>null);
      if(!r.ok || !data || !data.ok){
        msg((data&&data.message)||'Nie udało się uruchomić trybu gościa.');
        return;
      }
      sessionStorage.setItem('piFriendSessionV1',JSON.stringify(data));
      sessionStorage.removeItem('piOwnerSessionV570');
      sessionStorage.removeItem('piTenantSessionV54');
      sessionStorage.removeItem('piTenantMultiSessionV551');
      piWriteNavigationHandoff('friend',data);
      location.replace('/app.html');
      return;
    }catch(err){
      msg('Nie udało się połączyć z trybem gościa. Sprawdź funkcję Netlify friend-login.');
      return;
    }
  }

  const isEmail = loginRaw.includes('@');
  const normalizedPhone = String(loginRaw||'').replace(/\D/g,'');
  if(isEmail){
    const {data:authData,error}=await db.auth.signInWithPassword({email:loginRaw,password:secret});
    if(error){
      msg('Nieprawidłowy login lub hasło administratora. Zarządca/właściciel loguje się numerem telefonu i PIN-em.');
      return;
    }
    let confirmedSession=authData?.session || null;
    if(!confirmedSession){
      try{ confirmedSession=(await db.auth.getSession())?.data?.session || null; }catch(_){ }
    }
    if(!confirmedSession){
      msg('Logowanie zostało przyjęte, ale sesja nie została zapisana. Spróbuj ponownie.');
      return;
    }
    sessionStorage.setItem('piAuthHandoffV1919',JSON.stringify({createdAt:Date.now(),kind:'supabase'}));
    sessionStorage.removeItem('piOwnerSessionV570');
    sessionStorage.removeItem('piTenantSessionV54');
    piWriteNavigationHandoff('supabase',{access_token:confirmedSession.access_token,refresh_token:confirmedSession.refresh_token});
    location.replace('/app.html');
    return;
  }

  if(!normalizedPhone){msg('Wpisz numer telefonu jako login.');return;}

  let data;
  try{
    const r=await fetch('/.netlify/functions/owner-login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({phone:normalizedPhone,pin:secret})
    });
    data=await r.json().catch(()=>null);
  }catch(err){
    msg('Nie udało się połączyć z panelem zarządcy. Sprawdź wdrożenie funkcji Netlify owner-login.');
    return;
  }
  if(!data || !data.ok){
    msg((data&&data.message)||'Brak aktywnego konta zarządcy dla podanego telefonu lub PIN-u.');
    return;
  }
  sessionStorage.setItem('piOwnerSessionV570',JSON.stringify(data));
  sessionStorage.removeItem('piTenantSessionV54');
  sessionStorage.removeItem('piTenantMultiSessionV551');
  piWriteNavigationHandoff('owner',data);
  location.replace('/app.html');
});
$('tenantForm').addEventListener('submit',async e=>{e.preventDefault(); msg('Sprawdzam dostęp...'); const phone=$('tenantPhone').value, pin=$('tenantPin').value; if(!phone.replace(/\D/g,'')||!pin.trim()){msg('Podaj numer telefonu i kod dostępu.');return;} let data; try{ const r=await fetch('/.netlify/functions/tenant-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,pin})}); data=await r.json(); }catch(err){msg('Nie udało się połączyć z panelem najemcy.');return;} if(!data.ok){msg(data.message||'Brak dostępu.');return;} if(data.multiple&&Array.isArray(data.sessions)&&data.sessions.length>1){ showPicker(data); return; } data._clientVersion='1.9.19'; sessionStorage.setItem('piTenantSessionV54',JSON.stringify(data)); sessionStorage.removeItem('piTenantMultiSessionV551'); piWriteNavigationHandoff('tenant',data); location.replace('/app.html');});
function safe(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function money(v){return Number(v||0).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})+' zł'}
function showPicker(data){ sessionStorage.setItem('piTenantMultiSessionV551',JSON.stringify(data)); msg(''); const box=$('picker'); box.classList.remove('hidden'); const sessions=data.sessions||[]; box.innerHTML='<div class="hint">Wybierz mieszkanie:</div>'+sessions.map((s,i)=>{const p=s.property||{}; const meta=[p.address,p.area_m2?Number(p.area_m2).toLocaleString('pl-PL')+' m²':null,p.rent_amount?'Najem: '+money(p.rent_amount):null].filter(Boolean).join(' • '); return `<div class="choice" data-i="${i}"><b>${safe(p.name||'Mieszkanie')}</b><span>${safe(meta||'Podgląd mieszkania')}</span></div>`}).join(''); box.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{const s=sessions[Number(el.dataset.i)]; s._clientVersion='1.9.19'; sessionStorage.setItem('piTenantSessionV54',JSON.stringify(s)); piWriteNavigationHandoff('tenant',s); location.replace('/app.html');});}
(async()=>{try{ const friendStored=sessionStorage.getItem('piFriendSessionV1'); if(friendStored){ location.replace('/app.html'); return; } const ownerStored=sessionStorage.getItem('piOwnerSessionV570'); if(ownerStored){ location.replace('/app.html'); return; } const stored=sessionStorage.getItem('piTenantSessionV54'); if(stored){ location.replace('/app.html'); return; } const {data}=await db.auth.getSession(); if(data&&data.session){ location.replace('/app.html'); return; }}catch(e){} finally{ $('bootLoader').style.display='none'; }})();
</script>
